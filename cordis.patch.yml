# opencode-zen-compat bundle patch.
# 1) register itself as one Loader row.
# 2) v1.1.0+: inject the full custom provider "opencode-go-plus" into the
#    llm-pi-ai settings BASE layer (composition base, NOT the user
#    settings.yaml), so the model list survives installs/reinstalls and
#    disappears on uninstall. The route reuses the OPENCODE_GO_API_KEY
#    credential and speaks openai-completions to the opencode Zen gateway;
#    every model below was verified against /v1/chat/completions.
#    grok-4.5 is intentionally absent (it requires the openai-responses
#    protocol and fails on chat/completions); use the stock opencode-go route.

- insert:
    - id: opencode-zen-compat
      name: opencode-zen-compat

- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      opencode-go-plus:
        displayName: OpenCode Zen Go (Plus)
        apiKeyEnv: OPENCODE_GO_API_KEY
        api: openai-completions
        baseURL: https://opencode.ai/zen/go/v1
        models:
        - id: deepseek-v4-flash
          name: DeepSeek V4 Flash
          contextWindow: 1000000
          maxTokens: 384000
          input: [text]
          reasoningEfforts: { off: null, high: high, max: max }
        - id: deepseek-v4-pro
          name: DeepSeek V4 Pro
          contextWindow: 1000000
          maxTokens: 384000
          input: [text]
          reasoningEfforts: { off: null, high: high, max: max }
